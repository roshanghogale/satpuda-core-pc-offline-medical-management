[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# F: is a network share. Incremental codegen emits hundreds of .rcgu.o files
# whose paths overflow MSVC link.exe (~32K command line) and show up as
# "could not compile `app` (lib) due to 1 previous error" plus a huge
# link.exe dump.
[profile.dev]
incremental = false
codegen-units = 8
